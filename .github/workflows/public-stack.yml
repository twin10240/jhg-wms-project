name: Public stack watch
# 공개 데모가 조용히 죽는 것을 잡는다 — 이 맥이 잠들거나 터널이 끊기면
# wms.jhgsoft.com이 그대로 멎는데 아무도 모른다. 이력서에 링크가 걸려 있다.
# 컨테이너·AI 키·이미지 최신성은 로컬 Docker가 있어야 보이므로 여기서 건너뛴다
# (SKIP_CONTAINERS=1). 그쪽은 공개 스택을 바꾼 사람이 손으로 돌린다.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 공개 주소 점검
        env:
          SKIP_CONTAINERS: '1'
        run: docs/check-public-stack.sh
