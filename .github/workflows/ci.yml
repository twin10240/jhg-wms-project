name: CI

# master push / PR마다 자동 실행 — 커밋 히스토리에 빌드·테스트 통과 기록이 남는다.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    # 테스트가 운영과 같은 엔진을 쓴다. Actions가 컨테이너를 붙여주므로
    # Testcontainers 같은 Gradle 의존성이 필요 없다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms -d wms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Dockerfile 런타임과 동일한 Temurin 21. Gradle 캐시로 재실행 가속.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # build = 테스트(services의 PostgreSQL) + bootJar 조립. 배포 산출물이 실제로 만들어지는지까지 검증.
      - name: Build & run tests
        run: ./gradlew build --no-daemon

      # 실패해도 리포트는 남겨 원인 확인 가능하게.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wms-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      # Railway가 배포하는 것과 동일한 멀티스테이지 이미지가 빌드되는지 검증(CD 신뢰성).
      - name: Build Docker image
        run: docker build -t jhg-wms:ci .
