server:
  servlet:
    session:
      cookie:
        name: WMSSESSION

spring:
  # 테스트도 운영과 같은 엔진(PostgreSQL)을 쓴다 — FOR UPDATE·격리 수준은
  # 엔진이 직접 구현하는 부분이라 H2로는 운영 동작을 증명할 수 없다.
  # 전제: 로컬 Homebrew postgresql@17이 기동 중이고 wms/wms_test가 준비돼 있음.
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_test
    driver-class-name: org.postgresql.Driver
    username: wms
    password: wms
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_batch_fetch_size: 100
  # main과 동일: 기본(non-scale) 프로파일은 Redis 없이 서블릿 인메모리 세션.
  # test/resources의 application.yml이 classpath 우선순위상 main 것을 덮어써서
  # main의 이 exclude가 테스트엔 적용되지 않는다 — 여기 별도 명시 필요.
  # (없으면 세션에 뭔가 쓰이는 요청에서 RedisSessionRepository가 로컬에 없는
  #  Redis에 연결을 시도해 500이 난다 — 테스트 환경엔 Redis가 없음)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  # TestRestTemplate이 쓰는 RestTemplateBuilder의 기본 팩토리(HttpComponents)는 리다이렉트를
  # 자동으로 따라간다 — 세션 쿠키를 수동으로 실어보내는 SecurityChainIntegrationTest 같은 테스트에서
  # POST /login(302)을 조용히 따라가 미인증 "/" → "/login"까지 이어져 200으로 관측되는 원인이 된다.
  # 리다이렉트 미추적으로 고정해 raw 상태코드를 그대로 관측하게 한다.
  http:
    client:
      redirects: dont_follow
      # main의 application.yml은 이 파일에 통째로 덮여 테스트에 적용되지 않는다(위 exclude와 같은 이유).
      # OMS 콜백 hang 방지 타임아웃도 그래서 테스트에선 꺼져 있었다 — OmsSlowTest가 이 사실을 드러냈다.
      # main과 같은 값으로 맞춰야 "느린 OMS는 2초에 끊긴다"를 테스트가 증명할 수 있다.
      connect-timeout: 1s
      read-timeout: 2s
  # @DataJpaTest 기본값은 datasource를 임베디드로 치환한다. 위의 실제 PostgreSQL 설정을
  # 쓰게 하려면 꺼야 한다. 클래스마다 @AutoConfigureTestDatabase를 붙이는 대신 여기서 한 번에 끈다.
  test:
    database:
      replace: none

# 테스트에서 실제 OMS 호출 없음(커밋 후 발화 + 테스트 트랜잭션 롤백) — 빈 생성용 값만 제공
oms:
  base-url: http://localhost:8080
  callback:
    user: wms
    password: wms

wms:
  # InitDb의 @PostConstruct 시딩은 실제로 커밋된다 — 여러 테스트 컨텍스트가 물리 DB(wms_test)
  # 하나를 공유하므로 기본은 끈다. 시딩 자체를 검증하는 InitDbSeedingSmokeTest만 켠다.
  init-db:
    enabled: false
  basic:
    user: wms
    password: wms
  seed-users:
    operator-user: operator
    operator-password: operator
    manager-user: manager
    manager-password: manager
