<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <!-- 없으면 모바일 브라우저가 약 980px로 렌더한 뒤 축소한다 —
       .table-wrap의 가로 스크롤도 그 전제 위에서만 의미가 있다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 · JHG-WMS</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>
  <main class="login">
    <h1>JHG-WMS 로그인</h1>
    <p th:if="${param.error}" class="flash-err" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p th:if="${param.logout}" class="flash-ok" role="alert">로그아웃되었습니다.</p>
    <form th:action="@{/login}" method="post">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autofocus />
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" />
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
