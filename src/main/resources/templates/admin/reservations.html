<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 예약 현황')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('reservations')}"></nav>
<main>
  <h2>예약 현황</h2>
  <p class="label">예약·출고·해제는 OMS가 API로 처리합니다. 배송 실패·재배송·완료는 창고에서 기록합니다.</p>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="tabs">
    <a th:href="@{/admin/reservations}" th:classappend="${activeStatus == null and !pendingDelivery} ? 'active'">전체</a>
    <a th:href="@{/admin/reservations(pendingDelivery=true)}" th:classappend="${pendingDelivery} ? 'active'">배송 대기</a>
    <a th:href="@{/admin/reservations(status='RESERVED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'RESERVED'} ? 'active'">예약</a>
    <a th:href="@{/admin/reservations(status='SHIPPED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'SHIPPED'} ? 'active'">출고 완료</a>
    <a th:href="@{/admin/reservations(status='RELEASED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'RELEASED'} ? 'active'">예약 해제</a>
  </div>

  <div class="table-wrap">
  <table>
    <thead><tr><th>예약 ID</th><th>주문 ID</th><th>상태</th><th>상품ID</th><th>상품명</th><th>수량</th><th>송장</th><th>배송</th></tr></thead>
    <tbody>
      <tr th:each="r : ${reservations}">
        <td th:text="${r.id}">1</td>
        <td th:text="${r.orderId}">1</td>
        <td>
          <span th:switch="${r.status.name()}" class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(r.status.name())}">
            <span th:case="'RESERVED'">예약</span>
            <span th:case="'SHIPPED'">출고 완료</span>
            <span th:case="'RELEASED'">예약 해제</span>
          </span>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="${e.key}">1</div>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="${productNames.get(e.key)}">상품 1</div>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="|${e.value}개|">3개</div>
        </td>
        <td>
          <span th:if="${r.trackingNumber != null}" th:text="|${r.carrierCode} ${r.trackingNumber}|">MOCK MOCK-1-20260827063000</span>
          <span th:if="${r.trackingNumber == null}" class="hint">—</span>
        </td>
        <td th:with="ds=${r.deliveryStatus?.name()}">
          <!-- 상태마다 지금 할 수 있는 전이와 재통지 버튼만 그린다(서버도 전이표로 다시 검증한다).
               재통지 버튼을 남기는 이유: 통지는 best-effort라 보상 스윕이 없고,
               콜백이 유실됐을 때 창고가 스스로 복구할 수 있는 경로다. 재통지는 버전·시각을 바꾸지 않는다. -->
          <div th:if="${ds == 'DELIVERED'}">
            <span th:text="|배송 완료 ${#temporals.format(r.deliveredAt, 'yyyy-MM-dd HH:mm')}|">배송 완료</span>
            <form th:action="@{|/admin/reservations/${r.requestKey}/deliver|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="ghost sm" title="OMS에 배송 완료를 다시 통지합니다. 완료 시각은 그대로입니다.">OMS 재통지</button>
            </form>
          </div>
          <div th:if="${ds == 'DELIVERY_FAILED'}">
            <span class="badge badge-released"
                  th:text="|배송 실패 · ${r.deliveryFailureCode.label} ${#temporals.format(r.deliveryStatusAt, 'yyyy-MM-dd HH:mm')}|">배송 실패</span>
            <form th:action="@{|/admin/reservations/${r.requestKey}/redeliver|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="ghost sm">재배송</button>
            </form>
            <form th:action="@{|/admin/reservations/${r.requestKey}/delivery-failure|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="failureCode" th:value="${r.deliveryFailureCode.name()}" />
              <button type="submit" class="ghost sm" title="OMS에 배송 실패를 다시 통지합니다. 사유·시각은 그대로입니다.">OMS 재통지</button>
            </form>
          </div>
          <div th:if="${ds == 'SHIPPED'}">
            <span th:if="${r.deliveryVersion > 1}"
                  th:text="|재배송 중 ${#temporals.format(r.deliveryStatusAt, 'yyyy-MM-dd HH:mm')}|">재배송 중</span>
            <form th:action="@{|/admin/reservations/${r.requestKey}/deliver|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="ghost sm">배송 완료</button>
            </form>
            <form th:action="@{|/admin/reservations/${r.requestKey}/delivery-failure|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <select name="failureCode" required aria-label="배송 실패 사유">
                <option value="">실패 사유</option>
                <option th:each="c : ${failureCodes}" th:value="${c.name()}" th:text="${c.label}">수취인 부재</option>
              </select>
              <button type="submit" class="ghost sm">배송 실패</button>
            </form>
            <form th:if="${r.deliveryVersion > 1}"
                  th:action="@{|/admin/reservations/${r.requestKey}/redeliver|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="ghost sm" title="OMS에 재배송을 다시 통지합니다. 시각은 그대로입니다.">OMS 재통지</button>
            </form>
          </div>
          <span th:if="${ds == null}" class="hint">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(reservations)}">
        <td colspan="8">예약 내역이 없습니다.</td>
      </tr>
    </tbody>
  </table>
  </div>
</main>
</body>
</html>
