<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 예약 현황')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('reservations')}"></nav>
<main>
  <h2>예약 현황</h2>
  <p class="label">예약·출고·해제는 OMS가 API로 처리합니다. 배송 완료만 창고에서 기록합니다.</p>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="tabs">
    <a th:href="@{/admin/reservations}" th:classappend="${activeStatus == null and !pendingDelivery} ? 'active'">전체</a>
    <a th:href="@{/admin/reservations(pendingDelivery=true)}" th:classappend="${pendingDelivery} ? 'active'">배송 대기</a>
    <a th:href="@{/admin/reservations(status='RESERVED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'RESERVED'} ? 'active'">예약</a>
    <a th:href="@{/admin/reservations(status='SHIPPED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'SHIPPED'} ? 'active'">출고 완료</a>
    <a th:href="@{/admin/reservations(status='RELEASED')}" th:classappend="${!pendingDelivery and activeStatus != null and activeStatus.name() == 'RELEASED'} ? 'active'">예약 해제</a>
  </div>

  <div class="table-wrap">
  <table>
    <thead><tr><th>예약 ID</th><th>주문 ID</th><th>상태</th><th>상품ID</th><th>상품명</th><th>수량</th><th>송장</th><th>배송</th></tr></thead>
    <tbody>
      <tr th:each="r : ${reservations}">
        <td th:text="${r.id}">1</td>
        <td th:text="${r.orderId}">1</td>
        <td>
          <span th:switch="${r.status.name()}" class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(r.status.name())}">
            <span th:case="'RESERVED'">예약</span>
            <span th:case="'SHIPPED'">출고 완료</span>
            <span th:case="'RELEASED'">예약 해제</span>
          </span>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="${e.key}">1</div>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="${productNames.get(e.key)}">상품 1</div>
        </td>
        <td>
          <div th:each="e : ${r.qtyByProductId}" th:text="|${e.value}개|">3개</div>
        </td>
        <td>
          <span th:if="${r.trackingNumber != null}" th:text="|${r.carrierCode} ${r.trackingNumber}|">MOCK MOCK-1-20260827063000</span>
          <span th:if="${r.trackingNumber == null}" class="hint">—</span>
        </td>
        <td>
          <!-- 배송 완료된 행에도 재통지 버튼을 남긴다 — 통지는 best-effort라 보상 스윕이 없고,
               최초 콜백이 실패했을 때 창고가 스스로 복구할 수 있는 유일한 경로다. -->
          <div th:if="${r.deliveredAt != null}">
            <span th:text="|배송 완료 ${#temporals.format(r.deliveredAt, 'yyyy-MM-dd HH:mm')}|">배송 완료</span>
            <form th:action="@{|/admin/reservations/${r.orderId}/deliver|}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="ghost sm" title="OMS에 배송 완료를 다시 통지합니다. 완료 시각은 그대로입니다.">OMS 재통지</button>
            </form>
          </div>
          <form th:if="${r.status.name() == 'SHIPPED' and r.deliveredAt == null}"
                th:action="@{|/admin/reservations/${r.orderId}/deliver|}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="ghost sm">배송 완료</button>
          </form>
          <span th:if="${r.status.name() != 'SHIPPED'}" class="hint">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(reservations)}">
        <td colspan="8">예약 내역이 없습니다.</td>
      </tr>
    </tbody>
  </table>
  </div>
</main>
</body>
</html>
