<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('WMS 발주 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('purchase-orders')}"></nav>
<main>
  <h2>발주 관리</h2>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <!-- 발주 근거. 원장 실측만 낸다 — 무엇을 얼마나 발주할지는 사람이 정한다.
       원장이 한 행도 없으면 통째로 렌더하지 않는다(빈 껍데기를 두지 않는다). -->
  <!-- 발주 근거. 임박한 몇 행만 펴 두고 나머지는 접는다 — 소진이 먼 상품이
       발주 폼과 현황을 아래로 밀어내던 것을 없애되, 접힌 줄에 개수를 적어
       감춰진 것이 있다는 사실은 남긴다. <details>라 JS가 없다. -->
  <section class="advice" th:if="${advice != null and !advice.isEmpty()}"
           th:with="topCount=${advice.size() < 5 ? advice.size() : 5}">
    <h3>발주 근거 — 최근 30일 원장</h3>
    <div th:replace="~{fragments/advice :: table(${advice.subList(0, topCount)})}"></div>

    <details class="advice__rest" th:if="${advice.size() > topCount}">
      <summary th:text="'소진이 먼 나머지 ' + ${advice.size() - topCount} + '개 상품'">소진이 먼 나머지 15개 상품</summary>
      <div th:replace="~{fragments/advice :: table(${advice.subList(topCount, advice.size())})}"></div>
    </details>

    <p class="advice__note">
      원장에 실제로 찍힌 값입니다. 소진 예상은 가용재고 ÷ 일평균이고, 표본 일수가 짧을수록 흔들립니다.
      목표 재고일수나 안전재고 기준은 WMS에 없습니다 — 발주 수량은 직접 정하세요.
    </p>
  </section>

  <h3 sec:authorize="hasRole('MANAGER')">발주 생성</h3>
  <form sec:authorize="hasRole('MANAGER')" th:action="@{/admin/purchase-orders}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div id="po-lines">
      <div class="form-row po-line">
        <div>
          <label>상품 ID</label><br/>
          <select name="items[0].productId">
            <option th:each="p : ${products}" th:value="${p.productId}"
                    th:text="${p.productId + ' — ' + p.productName}">1 — 상품 1</option>
          </select>
        </div>
        <div>
          <label>수량</label><br/>
          <input type="number" name="items[0].quantity" min="1" value="10" style="width:80px" />
        </div>
      </div>
    </div>
    <div class="form-row">
      <button type="button" class="ghost sm" onclick="addLine()">+ 품목 추가</button>
      <button type="button" class="ghost sm" onclick="removeLine()">− 품목 삭제</button>
    </div>
    <div class="form-row">
      <div>
        <label>메모</label><br/>
        <input type="text" name="memo" placeholder="긴급 발주 등" />
      </div>
      <button type="submit">발주 생성</button>
    </div>
  </form>

  <h3>발주 현황</h3>
  <div class="tabs">
    <a th:href="@{/admin/purchase-orders}" th:classappend="${activeStatus == null} ? 'active'">전체</a>
    <a th:href="@{/admin/purchase-orders(status='ORDERED')}" th:classappend="${activeStatus != null and activeStatus.name() == 'ORDERED'} ? 'active'">입고대기</a>
    <a th:href="@{/admin/purchase-orders(status='PARTIALLY_RECEIVED')}" th:classappend="${activeStatus != null and activeStatus.name() == 'PARTIALLY_RECEIVED'} ? 'active'">부분입고</a>
    <a th:href="@{/admin/purchase-orders(status='RECEIVED')}" th:classappend="${activeStatus != null and activeStatus.name() == 'RECEIVED'} ? 'active'">입고완료</a>
    <a th:href="@{/admin/purchase-orders(status='CANCELLED')}" th:classappend="${activeStatus != null and activeStatus.name() == 'CANCELLED'} ? 'active'">취소됨</a>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr><th>발주번호</th><th>상태</th><th>상품ID</th><th>상품명</th><th>입고/발주</th><th>메모</th><th>발주일시</th><th>입고일시</th><th>입고</th></tr>
    </thead>
    <tbody>
      <tr th:each="po : ${purchaseOrders}"
          th:data-href="@{'/admin/purchase-orders/' + ${po.id}}">
        <td th:text="${po.id}">1</td>
        <td>
          <span th:switch="${po.status.name()}" class="badge"
                th:classappend="${po.status.name() == 'ORDERED'} ? 'badge--ordered' : (${po.status.name() == 'PARTIALLY_RECEIVED'} ? 'badge--partial' : (${po.status.name() == 'RECEIVED'} ? 'badge--received' : 'badge--cancelled'))">
            <span th:case="'ORDERED'">발주됨</span>
            <span th:case="'PARTIALLY_RECEIVED'">부분 입고</span>
            <span th:case="'RECEIVED'">입고 완료</span>
            <span th:case="'CANCELLED'">취소됨</span>
          </span>
        </td>
        <td>
          <div th:each="item : ${po.items}" th:text="${item.productId}">1</div>
        </td>
        <td>
          <div th:each="item : ${po.items}" th:text="${productNames.get(item.productId)}">상품 1</div>
        </td>
        <td>
          <div th:each="item : ${po.items}" th:text="|${item.receivedQty} / ${item.quantity}|">60 / 100</div>
        </td>
        <td th:text="${po.memo}">긴급</td>
        <td th:text="${#temporals.format(po.createdAt,'yyyy-MM-dd HH:mm')}">2026-07-01 10:00</td>
        <td th:text="${po.receivedAt != null} ? ${#temporals.format(po.receivedAt,'yyyy-MM-dd HH:mm')} : '—'">—</td>
        <td>
          <a class="sm" th:href="@{'/admin/purchase-orders/' + ${po.id}}">상세</a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(purchaseOrders)}">
        <td colspan="9">발주 내역이 없습니다.</td>
      </tr>
    </tbody>
  </table>
  </div>

  <script>
    function addLine() {
      const lines = document.getElementById('po-lines');
      const line = lines.firstElementChild.cloneNode(true);
      const idx = lines.children.length;
      line.querySelectorAll('select, input').forEach(el => {
        el.name = el.name.replace(/items\[\d+\]/, 'items[' + idx + ']');
      });
      lines.appendChild(line);
    }
    function removeLine() {
      const lines = document.getElementById('po-lines');
      if (lines.children.length > 1) lines.removeChild(lines.lastElementChild);
    }
  </script>
  <!-- 행 전체 클릭 → 상세. 상세 링크는 그대로 둔다(키보드·스크린리더 경로) —
       returns.html·cycle-counts.html과 같은 전례다.
       리스너를 .table-wrap이 아니라 main에 건다: 이 화면은 표가 둘이라
       querySelector('.table-wrap')가 발주 근거 표에 걸린다. 근거 표의 행에는
       data-href가 없어 클릭해도 아무 일도 일어나지 않는다. -->
  <script>
    document.querySelector('main').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-href]');
      if (!tr || e.target.closest('a')) return;
      if (window.getSelection().toString()) return;   // 텍스트 드래그 복사 중이면 이동하지 않는다
      location.href = tr.dataset.href;
    });
  </script>
</main>
</body>
</html>
