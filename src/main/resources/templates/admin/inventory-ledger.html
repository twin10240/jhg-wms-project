<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 수불대장')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('ledger')}"></nav>
<main>
  <h2>수불대장</h2>

  <div th:replace="~{fragments/layout :: flash}"></div>

  <form class="form-row" method="get" th:action="@{/admin/inventory/ledger}">
    <label>시작일 <input type="date" name="from" th:value="${from}" /></label>
    <label>종료일 <input type="date" name="to" th:value="${to}" /></label>
    <button type="submit">조회</button>
  </form>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>상품 ID</th><th>상품명</th>
        <th style="text-align:right">기초재고</th>
        <th style="text-align:right">기초설정</th>
        <th style="text-align:right">입고</th>
        <th style="text-align:right">반품입고</th>
        <th style="text-align:right">출고</th>
        <th style="text-align:right">조정</th>
        <th style="text-align:right">실사</th>
        <th style="text-align:right">기말재고</th>
      </tr>
    </thead>
    <tbody>
      <!-- 행 클릭 → 그 상품·그 기간의 이동내역(js/row-link.js).
           ponytail: returns·cycle-counts와 달리 셀 링크가 없어 키보드로는 갈 길이 없다. -->
      <tr th:each="row : ${ledger}"
          th:data-href="@{/admin/inventory/transactions(productId=${row.productId},from=${from},to=${to})}">
        <td th:text="${row.productId}">1</td>
        <td th:text="${row.productName}">상품 1</td>
        <td style="text-align:right" th:text="${row.opening}">100</td>
        <td style="text-align:right" th:text="${row.initial}">0</td>
        <td style="text-align:right" th:text="${row.receive}">20</td>
        <td style="text-align:right" th:text="${row.returnQty}">3</td>
        <td style="text-align:right" th:text="${row.ship}">-15</td>
        <td style="text-align:right" th:text="${row.adjust}">-2</td>
        <td style="text-align:right" th:text="${row.countQty}">1</td>
        <td style="text-align:right"><b th:text="${row.closing}">106</b></td>
      </tr>
      <tr th:if="${#lists.isEmpty(ledger)}">
        <td colspan="10">해당 기간에 재고 변동이 없습니다.</td>
      </tr>
    </tbody>
    <tfoot th:if="${!#lists.isEmpty(ledger)}">
      <tr style="font-weight:700; background:#eef0f4">
        <td colspan="2">합계</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![opening])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![initial])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![receive])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![returnQty])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![ship])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![adjust])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![countQty])}">0</td>
        <td style="text-align:right" th:text="${#aggregates.sum(ledger.![closing])}">0</td>
      </tr>
    </tfoot>
  </table>
  </div>

  <!-- 원장 불변식(Σdelta == onHand)은 문서 주장이었을 뿐 화면에서 확인할 수 없었다.
       buildLedger가 이미 집계하는 값이라 대조 비용이 거의 없다.
       table-wrap 바깥에 둔다 — 그 안은 10열 수불대장 폭에 맞춰 가로 스크롤되는 영역이라
       경고가 스크롤에 갇힌다. -->
  <div th:if="${invariantChecked}" style="margin-top:16px">
    <p th:if="${#lists.isEmpty(invariantViolations)}" class="hint">
      ✓ 원장 합계와 실제 보유수량이 일치합니다.
    </p>
    <div th:unless="${#lists.isEmpty(invariantViolations)}" role="alert"
         style="padding:12px; border:1px solid var(--color-danger); border-radius:var(--radius)">
      <strong>원장 합계와 실제 보유수량이 다릅니다.</strong>
      <!-- admin.css의 th,td는 left 정렬이다. 숫자 열은 th에도 우측 정렬을 줘야
           머리글과 값이 같은 축에 선다(수불대장 본표와 동일한 방식). -->
      <table style="margin-top:8px">
        <thead>
          <tr>
            <th>상품</th>
            <th style="text-align:right">원장 기말</th>
            <th style="text-align:right">실제 보유</th>
            <th style="text-align:right">차이</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="v : ${invariantViolations}">
            <td th:text="${v.productName}">상품 1</td>
            <td style="text-align:right" th:text="${v.ledgerClosing}">12</td>
            <td style="text-align:right" th:text="${v.actualOnHand}">15</td>
            <td style="text-align:right" th:text="${v.actualOnHand - v.ledgerClosing}">3</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
