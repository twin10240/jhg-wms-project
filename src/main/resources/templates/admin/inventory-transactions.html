<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 재고 트랜잭션 이력')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('transactions')}"></nav>
<main>
  <h2>재고 트랜잭션 이력</h2>

  <p>
    <a th:href="@{/admin/inventory/transactions}">전체</a>
    | <a th:href="@{/admin/inventory/transactions(type='OPENING')}">기초</a>
    | <a th:href="@{/admin/inventory/transactions(type='RECEIVE')}">입고</a>
    | <a th:href="@{/admin/inventory/transactions(type='SHIP')}">출고</a>
    | <a th:href="@{/admin/inventory/transactions(type='ADJUST')}">조정</a>
    | <a th:href="@{/admin/inventory/transactions(type='RETURN')}">반품</a>
    | <a th:href="@{/admin/inventory/transactions(type='COUNT')}">실사</a>
  </p>
  <div class="table-wrap">
  <table>
    <thead>
      <tr><th>일시</th><th>상품</th><th>유형</th><th>변동</th><th>변경 전 → 후</th><th>참조</th><th>사유</th><th>행위자</th></tr>
    </thead>
    <tbody>
      <tr th:each="t : ${transactions}">
        <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-21 15:00</td>
        <td th:text="${t.productId + ' — ' + productNames.get(t.productId)}">1 — 상품 1</td>
        <td th:switch="${t.type.name()}">
          <span th:case="'OPENING'">기초</span>
          <span th:case="'RECEIVE'">입고</span>
          <span th:case="'SHIP'">출고</span>
          <span th:case="'ADJUST'">조정</span>
          <span th:case="'RETURN'">반품</span>
          <span th:case="'COUNT'">실사</span>
          <span th:case="*" th:text="${t.type}">유형</span>
        </td>
        <td th:text="${(t.delta > 0 ? '+' : '') + t.delta}">+10</td>
        <td th:text="|${t.beforeQty} → ${t.afterQty}|">10 → 20</td>
        <td th:text="${t.reference == null ? '—'
                       : (t.reference.startsWith('PO#') ? '발주 #' + t.reference.substring(3)
                       : (t.reference.startsWith('ORDER#') ? '주문 #' + t.reference.substring(6)
                       : (t.reference.startsWith('RMA#') ? 'RMA #' + t.reference.substring(4)
                       : (t.reference.startsWith('COUNT#') ? '실사 #' + t.reference.substring(6)
                       : t.reference))))}">—</td>
        <td th:text="${t.reason}"></td>
        <td th:text="${t.actor != null ? t.actor : '—'}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(transactions)}">
        <td colspan="8">트랜잭션 없음</td>
      </tr>
    </tbody>
  </table>
  </div>

  <div class="paging" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/admin/inventory/transactions(type=${filterType}, page=${currentPage - 1})}">← 이전</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <th:block th:if="${i == 0 or i == totalPages - 1 or (i >= currentPage - 1 and i <= currentPage + 1)}">
        <strong th:if="${i == currentPage}" th:text="${i + 1}">1</strong>
        <a th:unless="${i == currentPage}"
           th:href="@{/admin/inventory/transactions(type=${filterType}, page=${i})}"
           th:text="${i + 1}">1</a>
      </th:block>
      <span th:if="${(i == 1 and currentPage > 2) or (i == totalPages - 2 and currentPage < totalPages - 3)}">…</span>
    </th:block>
    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/admin/inventory/transactions(type=${filterType}, page=${currentPage + 1})}">다음 →</a>
  </div>
</main>
</body>
</html>
