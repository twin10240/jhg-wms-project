<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 재고 트랜잭션 이력')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('transactions')}"></nav>
<main>
  <h2>재고 트랜잭션 이력</h2>

  <!-- 범위가 걸렸을 때만. 빈 껍데기를 두면 전역 저널에도 의미 없는 줄이 남는다. -->
  <p th:if="${productId != null or from != null or to != null}" class="hint">
    <span th:if="${productId != null}"
          th:text="${productNames.getOrDefault(productId, '상품#' + productId)}">상품 1</span>
    <span th:if="${from != null and to != null}"
          th:text="' · ' + ${from} + ' ~ ' + ${to}"> · 2026-09-01 ~ 2026-09-30</span>
    <span th:if="${from != null and to == null}"
          th:text="' · ' + ${from} + ' 이후'"> · 2026-09-01 이후</span>
    <span th:if="${from == null and to != null}"
          th:text="' · ' + ${to} + ' 까지'"> · 2026-09-30 까지</span>
    <!-- Thymeleaf 링크식은 파라미터 값이 null이어도 "type="처럼 빈 값으로 남긴다 —
         유형이 안 걸려 있을 땐(filterType == null) 아예 유형 파라미터를 빼야 진짜 "전체"로 돌아간다. -->
    <a th:if="${filterType != null}"
       th:href="@{/admin/inventory/transactions(type=${filterType})}">범위 해제</a>
    <a th:if="${filterType == null}"
       th:href="@{/admin/inventory/transactions}">범위 해제</a>
  </p>

  <!-- 드릴다운이 요약과 맞는지를 화면에서 확인한다. 아래 목록의 변동 합이 '이동'과 달라지면
       수불대장과 상세가 다른 이야기를 하는 것이고, 그건 두 숫자를 다 못 믿게 만든다.
       숫자는 수불대장을 만드는 buildLedger에서 그대로 나온다. -->
  <p th:if="${ledgerRow != null}" class="hint" id="ledger-recon">
    기초 <b th:text="${ledgerRow.opening}">100</b>
    + 이동 <b th:text="${ledgerRow.closing - ledgerRow.opening}">8</b>
    = 기말 <b th:text="${ledgerRow.closing}">108</b>
  </p>

  <p>
    <a th:href="@{/admin/inventory/transactions(productId=${productId},from=${from},to=${to})}">전체</a>
    | <a th:href="@{/admin/inventory/transactions(type='OPENING',productId=${productId},from=${from},to=${to})}">기초</a>
    | <a th:href="@{/admin/inventory/transactions(type='RECEIVE',productId=${productId},from=${from},to=${to})}">입고</a>
    | <a th:href="@{/admin/inventory/transactions(type='SHIP',productId=${productId},from=${from},to=${to})}">출고</a>
    | <a th:href="@{/admin/inventory/transactions(type='ADJUST',productId=${productId},from=${from},to=${to})}">조정</a>
    | <a th:href="@{/admin/inventory/transactions(type='RETURN',productId=${productId},from=${from},to=${to})}">반품</a>
    | <a th:href="@{/admin/inventory/transactions(type='COUNT',productId=${productId},from=${from},to=${to})}">실사</a>
  </p>
  <div class="table-wrap">
  <table>
    <thead>
      <tr><th>일시</th><th>상품</th><th>유형</th><th>변동</th><th>변경 전 → 후</th><th>참조</th><th>사유</th><th>행위자</th></tr>
    </thead>
    <tbody>
      <tr th:each="t : ${transactions}">
        <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-21 15:00</td>
        <td th:text="${t.productId + ' — ' + productNames.get(t.productId)}">1 — 상품 1</td>
        <td th:switch="${t.type.name()}">
          <span th:case="'OPENING'">기초</span>
          <span th:case="'RECEIVE'">입고</span>
          <span th:case="'SHIP'">출고</span>
          <span th:case="'ADJUST'">조정</span>
          <span th:case="'RETURN'">반품</span>
          <span th:case="'COUNT'">실사</span>
          <span th:case="*" th:text="${t.type}">유형</span>
        </td>
        <td th:text="${(t.delta > 0 ? '+' : '') + t.delta}">+10</td>
        <td th:text="|${t.beforeQty} → ${t.afterQty}|">10 → 20</td>
        <td th:text="${t.reference == null ? '—'
                       : (t.reference.startsWith('PO#') ? '발주 #' + t.reference.substring(3)
                       : (t.reference.startsWith('ORDER#') ? '주문 #' + t.reference.substring(6)
                       : (t.reference.startsWith('RMA#') ? 'RMA #' + t.reference.substring(4)
                       : (t.reference.startsWith('COUNT#') ? '실사 #' + t.reference.substring(6)
                       : t.reference))))}">—</td>
        <td th:text="${t.reason}"></td>
        <td th:text="${t.actor != null ? t.actor : '—'}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(transactions)}">
        <td colspan="8">트랜잭션 없음</td>
      </tr>
    </tbody>
  </table>
  </div>

  <div class="paging" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 0}"
       th:href="@{/admin/inventory/transactions(type=${filterType},productId=${productId},from=${from},to=${to},page=${currentPage - 1})}">← 이전</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <th:block th:if="${i == 0 or i == totalPages - 1 or (i >= currentPage - 1 and i <= currentPage + 1)}">
        <strong th:if="${i == currentPage}" th:text="${i + 1}">1</strong>
        <a th:unless="${i == currentPage}"
           th:href="@{/admin/inventory/transactions(type=${filterType},productId=${productId},from=${from},to=${to},page=${i})}"
           th:text="${i + 1}">1</a>
      </th:block>
      <span th:if="${(i == 1 and currentPage > 2) or (i == totalPages - 2 and currentPage < totalPages - 3)}">…</span>
    </th:block>
    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/admin/inventory/transactions(type=${filterType},productId=${productId},from=${from},to=${to},page=${currentPage + 1})}">다음 →</a>
  </div>
</main>
</body>
</html>
