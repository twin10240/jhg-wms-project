<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('WMS 대시보드')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('dashboard')}"></nav>
<main>
  <h2>대시보드</h2>
  <div class="cards">
    <div class="card">
      <h3>처리 대기</h3>
      <p class="big" th:text="${pendingRequestCount}">0</p>
      <p class="label">검토 대기 보충 요청</p>
      <p><a th:href="@{/admin/replenishment-requests}">보충 요청 검토 →</a></p>
      <p>부분 입고 발주 <b th:text="${partialPoCount}">0</b> · 가용 0 SKU <b th:text="${zeroAvailableCount}">0</b></p>
      <p>
        <a th:href="@{/admin/purchase-orders(status='PARTIALLY_RECEIVED')}">부분 입고 →</a> ·
        <a th:href="@{/admin/inventory}">재고 →</a>
      </p>
    </div>
    <div class="card">
      <h3>재고</h3>
      <p class="big" th:text="${skuCount}">20</p>
      <p class="label">SKU</p>
      <p>보유 <b th:text="${totalOnHand}">0</b> · 예약 <b th:text="${totalReserved}">0</b> · 가용 <b th:text="${totalAvailable}">0</b></p>
      <p><a th:href="@{/admin/inventory}">재고 관리 →</a></p>
    </div>
    <div class="card">
      <h3>발주</h3>
      <p class="big" th:text="${orderedPoCount}">0</p>
      <p class="label">입고대기</p>
      <p><a th:href="@{/admin/purchase-orders(status='ORDERED')}">입고대기 발주 →</a></p>
    </div>
    <div class="card">
      <h3>예약</h3>
      <p>
        <span class="badge badge-reserved">예약</span> <b th:text="${reservedCount}">0</b><br/>
        <span class="badge badge-shipped">출고 완료</span> <b th:text="${shippedCount}">0</b><br/>
        <span class="badge badge-released">예약 해제</span> <b th:text="${releasedCount}">0</b>
      </p>
      <p><a th:href="@{/admin/reservations}">예약 현황 →</a></p>
    </div>
    <div class="card" th:if="${rmaRequestedCount != null}">
      <h3>반품(RMA)</h3>
      <p class="big" th:text="${rmaRequestedCount}">0</p>
      <p class="label">입고 대기</p>
      <p>
        <span class="badge badge-received">입고</span> <b th:text="${rmaReceivedCount}">0</b> ·
        <span class="badge badge-completed">완료</span> <b th:text="${rmaCompletedCount}">0</b>
      </p>
      <p><a th:href="@{/admin/returns(status='REQUESTED')}">입고 대기 →</a></p>
    </div>
  </div>
</main>
</body>
</html>
