<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('WMS 발주 상세')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('purchase-orders')}"></nav>
<main>
  <h2>발주 #<span th:text="${po.id}">1</span></h2>
  <div th:replace="~{fragments/layout :: flash}"></div>

  <p>
    상태:
    <span th:switch="${po.status.name()}" class="badge"
          th:classappend="${po.status.name() == 'ORDERED'} ? 'badge--ordered' : (${po.status.name() == 'PARTIALLY_RECEIVED'} ? 'badge--partial' : (${po.status.name() == 'RECEIVED'} ? 'badge--received' : 'badge--cancelled'))">
      <span th:case="'ORDERED'">발주됨</span>
      <span th:case="'PARTIALLY_RECEIVED'">부분 입고</span>
      <span th:case="'RECEIVED'">입고 완료</span>
      <span th:case="'CANCELLED'">취소됨</span>
    </span>
    · 메모: <span th:text="${po.memo}">긴급</span>
    · 발주일시: <span th:text="${#temporals.format(po.createdAt,'yyyy-MM-dd HH:mm')}">2026-07-01 10:00</span>
    · 입고완료일시: <span th:text="${po.receivedAt != null} ? ${#temporals.format(po.receivedAt,'yyyy-MM-dd HH:mm')} : '—'">—</span>
  </p>

  <form id="poReceive" th:action="@{'/admin/purchase-orders/' + ${po.id} + '/receive'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <table>
      <thead>
        <tr><th>상품</th><th>발주량</th><th>입고량</th><th>잔량</th><th>이번 입고</th></tr>
      </thead>
      <tbody>
        <tr th:each="item, stat : ${po.items}">
          <td th:text="|상품#${item.productId}|">상품#1</td>
          <td th:text="${item.quantity}">100</td>
          <td th:text="${item.receivedQty}">60</td>
          <td th:text="${item.remainingQty()}">40</td>
          <td>
            <input type="hidden" th:name="|items[${stat.index}].itemId|" th:value="${item.id}" />
            <span th:if="${item.fullyReceived}">완료
              <input type="hidden" th:name="|items[${stat.index}].quantity|" value="0" />
            </span>
            <span th:unless="${item.fullyReceived}">
              <input type="number" th:name="|items[${stat.index}].quantity|"
                     min="0" th:max="${item.remainingQty()}" value="0" style="width:80px" />
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </form>

  <!-- 발주 취소 폼(빈 폼) — 버튼은 아래 액션 행에서 form= 속성으로 제출 -->
  <form id="poCancel" sec:authorize="hasRole('MANAGER')"
        th:if="${po.status.name() == 'ORDERED' or po.status.name() == 'PARTIALLY_RECEIVED'}"
        th:action="@{/admin/purchase-orders/{id}/cancel(id=${po.id})}" method="post"
        onsubmit="return confirm('이 발주를 취소하시겠습니까? 이미 입고된 수량은 유지됩니다.');">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>

  <!-- 테이블 아래 우측: 발주 취소 · 입고 처리 나란히 -->
  <div class="detail-actions">
    <button type="submit" form="poCancel" class="btn btn--danger"
            sec:authorize="hasRole('MANAGER')"
            th:if="${po.status.name() == 'ORDERED' or po.status.name() == 'PARTIALLY_RECEIVED'}">발주 취소</button>
    <button type="submit" form="poReceive"
            th:if="${po.status.name() == 'ORDERED' or po.status.name() == 'PARTIALLY_RECEIVED'}">입고 처리</button>
  </div>

  <p><a th:href="@{/admin/purchase-orders}">← 발주 목록</a></p>
</main>
</body>
</html>
