spring:
  application:
    name: jhg-wms
  # WMS 자체 DB(OMS와 물리 분리). 개발·테스트·운영 모두 PostgreSQL.
  # 전제(로컬): brew services start postgresql@17 — 로컬 개발·테스트는 Docker를 쓰지 않는다(운영 배포는 Dockerfile 사용).
  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    driver-class-name: org.postgresql.Driver
    username: wms
    password: wms
  jpa:
    hibernate:
      ddl-auto: update   # 기본: 데이터 보존. local 프로파일은 create(아래)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  # S4: RestClient 공통 타임아웃 — OMS 콜백(OmsReplenishmentNotifier) hang 방지.
  # 자동구성 RestClient.Builder 전체에 적용(Spring Boot 3.4+).
  http:
    client:
      connect-timeout: 1s
      read-timeout: 2s
  # 기본은 서블릿 컨테이너 인메모리 세션(Railway 단일 인스턴스·로컬 개발).
  # store-type=none은 StoreType enum에 없어 무시되므로(=Redis 세션이 그대로 켜짐) 쓰면 안 된다.
  # 대신 Redis 세션·리포지토리 auto-config 자체를 제외한다. scale 프로파일의
  # RedisSessionConfig(@EnableRedisHttpSession)가 명시적으로 Redis 세션을 켠다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# OMS가 8080이므로 WMS는 8081로 동시 기동 가능. Railway는 PORT 주입(Variables로 8081 고정 권장).
server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        name: WMSSESSION

# 재고 보충 콜백(채널3) 대상 — OMS. 운영은 OMS_BASE_URL 주입(Railway private networking).
# callback.user/password는 OMS가 검증하는 Basic Auth 자격증명 — OMS 쪽에도 동일 값 필수.
# 로컬 기본값은 wms/wms. 운영은 prod 프로파일에서 기본값 없이 오버라이드(아래) — 누락 시 기동 실패.
oms:
  base-url: ${OMS_BASE_URL:http://localhost:8080}
  callback:
    user: ${OMS_CALLBACK_USER:wms}
    password: ${OMS_CALLBACK_PASSWORD:wms}

# WMS 공개 URL 대비 HTTP Basic 인증 계정. OMS 어댑터가 같은 자격증명으로 호출해야 로컬 통합이 안 깨진다.
# 로컬 기본값은 wms/wms(OMS와 일치). 운영은 WMS_BASIC_USER/WMS_BASIC_PASSWORD로 override.
wms:
  basic:
    user: ${WMS_BASIC_USER:wms}
    password: ${WMS_BASIC_PASSWORD:wms}
  # 관리자 폼 로그인 계정 시드. 로컬 기본값 operator/manager, 운영은 prod에서 기본값 없이 주입.
  seed-users:
    operator-user: ${WMS_OPERATOR_USER:operator}
    operator-password: ${WMS_OPERATOR_PASSWORD:operator}
    manager-user: ${WMS_MANAGER_USER:manager}
    manager-password: ${WMS_MANAGER_PASSWORD:manager}

---
# 스키마 리셋용: --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create
---
# 운영 프로파일(Railway): PostgreSQL. SPRING_PROFILES_ACTIVE=prod + Postgres 플러그인 변수(PG*) 주입.
# 스키마는 ddl-auto update(신생 앱 — Flyway 미도입 결정), 빈 DB면 InitDb가 재고 1~20 시드.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
# 로컬 기본값(wms/wms) 없이 오버라이드 — 미설정 시 플레이스홀더 해석 실패로 기동 자체가 막힌다.
oms:
  callback:
    user: ${OMS_CALLBACK_USER}
    password: ${OMS_CALLBACK_PASSWORD}
# 관리자 계정 시드도, OMS→WMS 서비스 계정도 로컬 기본값 없이 오버라이드 — 미설정 시 기동 자체가 막힌다.
wms:
  basic:
    user: ${WMS_BASIC_USER}
    password: ${WMS_BASIC_PASSWORD}
  seed-users:
    operator-user: ${WMS_OPERATOR_USER}
    operator-password: ${WMS_OPERATOR_PASSWORD}
    manager-user: ${WMS_MANAGER_USER}
    manager-password: ${WMS_MANAGER_PASSWORD}
---
# 수평 확장 데모 프로파일(로컬 docker-compose 전용) — prod와 함께 활성: SPRING_PROFILES_ACTIVE=prod,scale
# prod가 Postgres 데이터소스를 제공하고, scale은 그 위에 Redis 공유 세션을 얹는다.
# Redis 공유 세션 → 인스턴스 간 HttpSession(및 세션 기반 CSRF 토큰) 공유 → 관리자 UI가 다중 인스턴스에서 안 깨짐.
# 분산 락(RedissonConfig, @Profile("scale"))은 InitDb 시딩 경합을 막는다. Railway(prod 단독)에는 영향 없음.
spring:
  config:
    activate:
      on-profile: scale
  # 세션은 RedisSessionConfig(@Profile("scale") @EnableRedisHttpSession)가 켠다.
  # 여기선 그 세션과 Redisson 락이 붙을 Redis 연결 좌표만 준다.
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
