plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jhg'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	// 수평 확장(scale 프로파일) 전용 — 공유 세션 스토어 + 분산 락.
	// Railway 단일 인스턴스(prod)에선 session.store-type=none·RedissonConfig 비활성이라 미사용.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.redisson:redisson:3.37.0'
	// 반품 사유 자동 분류(V4.0). 키가 없으면 AiConfig가 비활성 구현으로 대체하므로 기동은 정상.
	implementation 'com.anthropic:anthropic-java:2.34.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'   // dev·test·prod 공통 — H2는 V3.0에서 제거됨
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 실제 Claude API를 부르는 평가는 기본 test에서 뺀다.
// CI가 ./gradlew build를 돌리고 그것이 test를 부르므로, 여기서 빼지 않으면
// 매 push마다 과금된다. 이 저장소의 첫 @Tag 사용이다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'eval'
	}
}

// 분류 품질 평가 전용. 실행: ./gradlew evalTest (ANTHROPIC_API_KEY 필요)
tasks.register('evalTest', Test) {
	group = 'verification'
	description = '반품 사유 분류 품질 평가 — 실제 API를 호출하며 과금된다'
	useJUnitPlatform {
		includeTags 'eval'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	// 매번 실제로 돌아야 의미가 있다. Gradle이 "변경 없음"으로 건너뛰지 않게 한다.
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}
