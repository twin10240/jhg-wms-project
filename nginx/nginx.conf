events {}

http {
    # 앞단에 TLS를 끊는 터널(Tailscale Funnel 등)이 있으면 그쪽이 준 스킴을 그대로 넘긴다.
    # $scheme로 덮어쓰면 항상 http가 되어 앱의 리다이렉트가 https 밖으로 나간다.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # WMS 인스턴스 3개 — least_conn: 활성 연결이 가장 적은 인스턴스로 분산.
    upstream wms_backend {
        least_conn;
        server wms1:8081;
        server wms2:8081;
        server wms3:8081;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://wms_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # 데모용: 이번 요청을 처리한 백엔드 인스턴스를 응답 헤더로 노출.
            # 반복 요청 시 wms1→wms2→wms3 로 바뀌는 걸 눈으로 확인(라운드로빈 증거).
            add_header X-Served-By $upstream_addr always;
        }
    }
}
